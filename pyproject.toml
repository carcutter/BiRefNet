[project]
name = "birefnet"
version = "0.1.0"
description = "Bilateral Reference for High-Resolution Dichotomous Image Segmentation (CAAI AIR 2024)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5.0",
    "torchvision",
    "numpy<2",
    "opencv-python",
    "timm",
    "scipy",
    "scikit-image",
    "kornia",
    "einops",
    "tqdm",
    "prettytable",
    "tabulate",
    "ipykernel",
    "huggingface-hub>0.25",
    "accelerate",
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "tensorboard>=2.20.0",
    "pyyaml>=6.0.3",
    "wandb>=0.27.0",
    "matplotlib>=3.10.9",
    "onnxruntime>=1.26.0",
    "deform-conv2d-onnx-exporter>=1.2.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
