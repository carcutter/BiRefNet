# Coarse BiRefNet model — Swin-L backbone, with EXTRA loss weight on foreground blobs that are
# isolated inside window (blue) regions.
#
# Variant of configs/coarse-swin-l.yaml (square 1024, same baseline/split/schedule). The only
# change is the loss: small interior objects seen *within* a window (a red/green FG connected
# component whose surrounding ring is mostly blue window) are easy for the model to drop, so we
# upweight the BCE on exactly those pixels.
#
# How it works:
#   * The dataset detects, per frame, FG (red/green) connected components surrounded by window
#     (blue) and emits a 0/1 weight map (see utils.path_to_window_blob_map; detection params live
#     in config.py:window_blob_*). The map rides the same flip/rotate augmentation as the GT.
#   * PixLoss switches its 'bce' term to a spatially-weighted BCE  weight = 1 + (k-1)*map , so the
#     flagged pixels count k× (k = window_blob_loss_weight). All other loss terms are unchanged.
#   * OFF unless window_blob_loss: true (default false ⇒ every other config is byte-identical).
#
# Precedence (strict): argparse defaults < this file < CLI flags
# Unknown keys here fail loudly — argparse `dest` names must match 1:1.
# Resolved config is dumped to <ckpt_dir>/config.resolved.yaml at train start.

# ---- Training loop ----
# epochs is the ABSOLUTE target epoch: epoch_st is parsed from the resume filename (epoch_590),
# so 640 = 590 + 50 ⇒ 50 fine-tuning epochs (mirrors the baseline square run).
epochs: 640
batch_size: 2
ckpt_dir: runs/coarse-swin-l-window-blob          # separate output dir ⇒ does not touch other runs
resume: weights/BiRefNet-DIS-epoch_590.pth        # same DIS-pretrained baseline as the square run
dist: false
use_accelerate: false
smoke_test: 0

# ---- Model ----
bb: swin_v1_l                # Swin-L backbone — must match the resume checkpoint's architecture.
input_size: 1024             # square 1024 (matches the baseline run); each side divisible by 32

# ---- Window-blob loss (the point of this config) ----
window_blob_loss: true       # upweight BCE on FG blobs isolated inside window (blue) regions
window_blob_loss_weight: 5.0 # k: those pixels count 5× in the BCE term

# ---- Dataset / split (must match between training and tools/report.py) ----
csv_index: index.csv         # full interior dataset (data/interior_segmentation/index.csv)
val_split: 0.2
csv_split_seed: 42

# ---- Experiment logging ----
logger: both                 # one of: tensorboard | wandb | both | none
wandb_project: birefnet-interior
wandb_run_name: null         # null ⇒ basename(ckpt_dir) = coarse-swin-l-window-blob
wandb_entity: meero_rd       # W&B entity (team) name

# ---- Metrics ----
contour_radius: 4            # boundary-IoU ring half-width (px); same as the baseline 1024 run
