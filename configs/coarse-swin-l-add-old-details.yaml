# Coarse BiRefNet (Swin-L) — FULL fine-tune from the public DIS checkpoint on the data/train index.
# Fresh full FT (encoder + decoder), 90/10 rng split + early stopping. Uses the current augmentation
# set (incl. the new half-size crop p=0.3 and letterbox p=0.3, active via config.preproc_methods).
#
# Precedence (strict): argparse defaults < this file < CLI flags. Unknown keys fail loudly.

# ---- Training loop ----
# Renamed from coarse-swin-l-data-train (see runs/). Resumes the in-progress run from its epoch_600
# checkpoint: epoch_st parsed from the filename => starts 601; 690 = target (100 epochs from DIS ep590).
epochs: 690
batch_size: 2                 # Swin-L @1024; bs=1 breaks BatchNorm.
ckpt_dir: runs/coarse-swin-l-add-old-details
resume: runs/coarse-swin-l-add-old-details/epoch_600.pth   # continue the renamed run (weights preserved)
dist: false
use_accelerate: false
smoke_test: 0

# ---- Full fine-tune (encoder trained) ----
freeze_bb: false

# ---- Checkpointing ----
save_step: 10
save_last: 100

# ---- Early stopping ----
early_stop_patience: 10
early_stop_min_delta: 0.0

# ---- Model ----
bb: swin_v1_l
input_size: 1024
mixed_precision: fp16         # AMP fp16 training (matches fp16 deployment); manual path autocasts + GradScaler

# ---- Loss ----
window_blob_loss: false

# ---- Dataset / split ----
# In-CSV paths are relative to the index's own dir (data_link/train), which MyData tries as a
# resolution root; missing image/mask pairs are dropped automatically (robust to a mid-update index).
csv_index: /home/renato/projects/interior-segmentation/BiRefNet/data_link/train/index.csv
val_split: 0.1                # 90/10 split
csv_split_seed: 42
num_workers: 8

# ---- Experiment logging ----
logger: tensorboard,mlflow    # wandb removed. MLflow: local sqlite store under ckpt_dir/mlflow.db unless MLFLOW_TRACKING_URI is set.
wandb_project: birefnet-interior
wandb_run_name: coarse-swin-l-add-old-details   # MLflow/TB run name
wandb_entity: meero_rd

# ---- Metrics ----
contour_radius: 4
