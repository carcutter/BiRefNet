# Coarse BiRefNet model — Swin-L backbone, 4:3 (landscape) input instead of square.
#
# Variant of configs/coarse-swin-l.yaml. The only behavioural change is the input resolution:
# the interior frames are natively ~4:3 landscape (median aspect w/h = 1.333, dominant native
# resolution 2000x1500), so the square 1024x1024 of the original run vertically stretches every
# image. Here we feed 1024 (W) x 768 (H) — exact 4:3 — so the model sees undistorted geometry.
#
# IMPORTANT — input_size axis order: config.size is consumed only by cv2.resize(img, size), which
# takes (WIDTH, HEIGHT). So the FIRST value is the width. "1024x768" ⇒ 1024 wide x 768 tall
# (4:3 landscape). (train.py's --input_size help labels these "H,W", but that label is inverted
# relative to the actual cv2 (W,H) usage — General-2K's (2560,1440) is likewise W x H landscape.)
# Both sides must be divisible by 32: 1024/32=32, 768/32=24. ✓
#
# Kept separate from the square run via ckpt_dir/run name so the two are directly comparable
# (same pretrained baseline, same split, same schedule — only the aspect ratio differs).
#
# Precedence (strict): argparse defaults < this file < CLI flags
# Unknown keys here fail loudly — argparse `dest` names must match 1:1.
# Resolved config is dumped to <ckpt_dir>/config.resolved.yaml at train start.

# ---- Training loop ----
# epochs is the ABSOLUTE target epoch: epoch_st is parsed from the resume filename (epoch_590),
# so 640 = 590 + 50 ⇒ 50 fine-tuning epochs (mirrors the square run for a fair comparison).
epochs: 640
batch_size: 2                # 1024x768 is ~75% of the 1024x1024 activations, so this fits at least
                             # as well as the square run. Re-probe if you want to push it:
                             #   uv run python tools/find_max_batch_size.py --config configs/coarse-swin-l-4x3.yaml --input_size 1024x768
ckpt_dir: runs/coarse-swin-l-4x3            # separate output dir ⇒ does not touch runs/coarse-swin-l
# Official Swin-L pretrained BiRefNet (DIS, natively trained @1024). Start from the SAME baseline
# as the square run so the only difference under test is the input aspect ratio.
resume: weights/BiRefNet-DIS-epoch_590.pth
dist: false
use_accelerate: false
smoke_test: 0

# ---- Model ----
bb: swin_v1_l                # Swin-L backbone — must match the resume checkpoint's architecture.
input_size: "1024x768"       # (W x H) = 1024 wide x 768 tall ⇒ 4:3 landscape; each side divisible by 32

# ---- Dataset / split (must match between training and tools/report.py) ----
csv_index: index.csv         # full interior dataset (data/interior_segmentation/index.csv), NOT the blob crops
val_split: 0.2
csv_split_seed: 42

# ---- Experiment logging ----
logger: both                 # one of: tensorboard | wandb | both | none
wandb_project: birefnet-interior
wandb_run_name: null         # null ⇒ basename(ckpt_dir) = coarse-swin-l-4x3 (auto-separated from the square run)
wandb_entity: meero_rd       # W&B entity (team) name

# ---- Metrics ----
contour_radius: 4            # boundary-IoU ring half-width (px); same as the 1024 square run
